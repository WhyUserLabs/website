<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- GitHub Pages serves this file, with a 404 status, for any URL that has
     no file. Links are root-absolute because this page can be served at any
     depth. Retired URLs that have a direct successor get a redirect stub
     (see glossary/, compare/, manifesto.html). The script below only helps
     people who follow an old link to a retired section with no stub. -->
<title>Page not found | WhyUser</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico?v=3" sizes="any">
<script>
(function () {
  var p = location.pathname;
  var moved = [
    ['/census/', '/benchmarks/']   /* category census became Benchmarks, 24 Sep 2026 */
  ];
  for (var i = 0; i < moved.length; i++) {
    if (p.indexOf(moved[i][0]) === 0) { location.replace(moved[i][1]); return; }
  }
})();
</script>

</style>
