<title id="cgT">The conflict graph: how a buying committee moved, and where it stopped</title>
<desc id="cgD">Five committee roles connected by seven handoffs. Five hold and two snap. Every role finished convinced at intent seven out of ten and forty-five of fifty runs clicked forward, yet none converted, because the End User could not hand the case to the Technical Decision Maker without documentation and the Champion could not hand it to the Economic Buyer without inspectable proof.</desc>
