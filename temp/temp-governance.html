  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rm:rotate(45deg) scale(1.1)}}\n@media (prefers-reduced-motion:reduce){\n*{animation-duration:0.001ms!important;animation-iteration-count:1!important;transition-duration:0.001ms!important}\n}\n\n<\u002Fstyle>\n  <script src=\"93385fd9-1a33-4095-bfbc-a7706f7c2d79\"><\u002Fscript>\n  <style>\n    body{margin:0;background:#fff;color:var(--gray-950)}\n    a{color:var(--color-primary-action)}\n    a:hover{color:var(--blue-700)}\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"font-family:var(--font-body);overflow-x:hidden\">\n\n  <header style=\"display:flex;align-items:center;justify-content:space-between;padding:20px 40px;max-width:1200px;margin:0 auto;box-sizing:border-box\">\n    <div style=\"display:flex;align-items:center;gap:10px;height:22px;color:var(--gray-950)\">\n      <img src=\"3dcbae1a-2027-4cdd-995f-c159dba16bbf\" alt=\"Mezmo\" style=\"height:22px;display:block\">\n      <span style=\"width:1px;height:16px;background:var(--gray-300)\"><\u002Fspan>\n      <span style=\"font-size:14px;font-weight:500;color:var(--gray-700)\">Governance<\u002Fspan>\n    <\u002Fdiv>\n    <x-import component-from-global-scope=\"MezmoDesignSystem_d27913.Button\" from=\"93385fd9-1a33-4095-bfbc-a7706f7c2d79#/_ds_bundle.js\" variant=\"outline\" size=\"sm\" hint-size=\"110px,36px\">\n      <a href=\"https://mezmo.com/contact\" style=\"color:inherit;text-decoration:none\">Talk to us<\u002Fa>\n    <\u002Fx-import>\n  <\u002Fheader>\n\n  <!-- HERO -->\n  <section style=\"position:relative;padding:64px 40px 96px;max-width:1200px;margin:0 auto;box-sizing:border-box;overflow:hidden\">\n    <div style=\"position:absolute;top:-160px;right:-160px;width:520px;height:520px;border-radius:50%;background:var(--purple-200);filter:blur(90px);opacity:0.4;pointer-events:none\"><\u002Fdiv>\n    <svg sc-camel-view-box=\"0 0 21 21\" style=\"position:absolute;top:40px;right:120px;width:28px;height:28px;color:var(--purple-300);opacity:0.6;pointer-events:none\"><path d=\"M9.00416 19.4372L6.29857 13.7948L0.656162 11.0892C-0.218721 10.6691 -0.218721 9.42425 0.656162 9.00415L6.29857 6.29857L9.00416 0.656161C9.42425 -0.21872 10.6691 -0.21872 11.0892 0.656161L13.7948 6.29857L19.4372 9.00415C20.3121 9.42425 20.3121 10.6691 19.4372 11.0892L13.7948 13.7948L11.0892 19.4372C10.6691 20.3121 9.42425 20.3121 9.00416 19.4372Z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg>\n    <svg sc-camel-view-box=\"0 0 21 21\" style=\"position:absolute;top:140px;right:60px;width:16px;height:16px;color:var(--yellow-400);opacity:0.7;pointer-events:none\"><path d=\"M9.00416 19.4372L6.29857 13.7948L0.656162 11.0892C-0.218721 10.6691 -0.218721 9.42425 0.656162 9.00415L6.29857 6.29857L9.00416 0.656161C9.42425 -0.21872 10.6691 -0.21872 11.0892 0.656161L13.7948 6.29857L19.4372 9.00415C20.3121 9.42425 20.3121 10.6691 19.4372 11.0892L13.7948 13.7948L11.0892 19.4372C10.6691 20.3121 9.42425 20.3121 9.00416 19.4372Z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg>\n    <div style=\"position:relative;display:flex;gap:48px;align-items:center;flex-wrap:wrap\">\n    <div style=\"flex:1;min-width:320px;max-width:640px\">\n      <div style=\"font-size:13px;font-weight:500;color:var(--gray-700);margin-bottom:20px\">PLATFORM · GOVERNANCE<\u002Fdiv>\n      <h1 style=\"font-size:56px;font-weight:600;line-height:1.1;color:var(--gray-950);margin:0 0 24px\">SRE agents need <i>boundaries<\u002Fi>, not blanket access.<\u002Fh1>\n      <p style=\"font-size:18px;font-weight:300;line-height:1.65;color:var(--gray-700);margin:0 0 16px;max-width:620px\">Agents can investigate incidents, reason across telemetry and runbooks, and recommend what to do next. The harder question comes when they can act: what should the agent be allowed to do on its own, what needs a human, and what should never happen at all?<\u002Fp>\n      <p style=\"font-size:18px;font-weight:600;line-height:1.5;color:var(--gray-950);margin:0 0 36px;max-width:620px\">Mezmo Governance puts policy between an agent request and production execution.<\u002Fp>\n      <div style=\"display:flex;gap:14px;flex-wrap:wrap\">\n        <x-import component-from-global-scope=\"MezmoDesignSystem_d27913.Button\" from=\"93385fd9-1a33-4095-bfbc-a7706f7c2d79#/_ds_bundle.js\" variant=\"solid\" size=\"lg\" hint-size=\"150px,48px\">\n          <a href=\"https://mezmo.com\" style=\"color:inherit;text-decoration:none\">See how governed SRE agents work<\u002Fa>\n        <\u002Fx-import>\n        <x-import component-from-global-scope=\"MezmoDesignSystem_d27913.Button\" from=\"93385fd9-1a33-4095-bfbc-a7706f7c2d79#/_ds_bundle.js\" variant=\"outline\" size=\"lg\" hint-size=\"150px,48px\">\n          <a href=\"https://mezmo.com/contact\" style=\"color:inherit;text-decoration:none\">Talk to us about your agent workflow<\u002Fa>\n        <\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;min-width:280px;max-width:380px\">\n      <div style=\"background:var(--color-dark-background);border-radius:var(--radius-product-lg);padding:20px;box-shadow:var(--shadow-product-lg);border:1px solid var(--gray-800)\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:16px\">\n          <span style=\"font-size:12px;font-weight:500;color:var(--gray-500)\">GOVERNANCE REQUEST<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:var(--radius-product-pill);background:var(--green-100);color:var(--green-800)\">Allowed<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;font-family:var(--font-mono);font-size:13px;color:var(--gray-300)\">\n          <div><span style=\"color:var(--gray-500)\">tool<\u002Fspan>&nbsp;&nbsp;k8s.scale_deployment<\u002Fdiv>\n          <div><span style=\"color:var(--gray-500)\">namespace<\u002Fspan>&nbsp;&nbsp;payments-prod<\u002Fdiv>\n          <div><span style=\"color:var(--gray-500)\">policy<\u002Fspan>&nbsp;&nbsp;v14<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- THE SHIFT -->\n  <section style=\"padding:88px 40px;background:var(--gray-50)\">\n    <div style=\"max-width:1120px;margin:0 auto\">\n      <div style=\"font-size:13px;font-weight:500;color:var(--gray-700);margin-bottom:14px\">THE SHIFT<\u002Fdiv>\n      <h2 style=\"font-size:34px;font-weight:600;color:var(--gray-950);margin:0 0 20px;max-width:680px\">All-or-nothing access doesn't scale.<\u002Fh2>\n      <p style=\"font-size:17px;font-weight:300;line-height:1.65;color:var(--gray-700);margin:0 0 40px;max-width:680px\">Production teams usually end up at one of two extremes.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:20px;margin-bottom:32px\">\n        <x-import component-from-global-scope=\"MezmoDesignSystem_d27913.Card\" from=\"93385fd9-1a33-4095-bfbc-a7706f7c2d79#/_ds_bundle.js\" hint-size=\"100%,140px\">\n          <div style=\"font-size:18px;font-weight:600;color:var(--gray-950);margin-bottom:8px\">Approve every action manually<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:300;line-height:1.6;color:var(--gray-700)\">Every sensitive request waits for a human. Safe, repetitive work waits too, and approval fatigue follows.<\u002Fdiv>\n        <\u002Fx-import>\n        <x-import component-from-global-scope=\"MezmoDesignSystem_d27913.Card\" from=\"93385fd9-1a33-4095-bfbc-a7706f7c2d79#/_ds_bundle.js\" hint-size=\"100%,140px\">\n          <div style=\"font-size:18px;font-weight:600;color:var(--gray-950);margin-bottom:8px\">Grant broad autonomy<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:300;line-height:1.6;color:var(--gray-700)\">The agent can move quickly, but its authority can extend far beyond the action you intended to trust.<\u002Fdiv>\n        <\u002Fx-import>\n      <\u002Fdiv>\n      <p style=\"font-size:18px;font-weight:600;color:var(--gray-950);margin:0 0 12px;max-width:680px\">Govern the boundary between them.<\u002Fp>\n      <p style=\"font-size:17px;font-weight:300;line-height:1.65;color:var(--gray-700);margin:0;max-width:680px\">Standing policy lets known-safe requests proceed. Sensitive actions stop for human review. Anything outside policy follows a fallthrough you set — deny, approve, or allow. The agent can keep working without getting blanket authority over production.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- THE BOUNDARY -->\n  <section style=\"padding:88px 40px\">\n    <div style=\"max-width:1120px;margin:0 auto\">\n      <div style=\"font-size:13px;font-weight:500;color:var(--gray-700);margin-bottom:14px\">THE BOUNDARY<\u002Fdiv>\n      <h2 style=\"font-size:34px;font-weight:600;color:var(--gray-950);margin:0 0 20px;max-width:680px\">Every governed request gets one of three outcomes<\u002Fh2>\n      <p style=\"font-size:17px;font-weight:300;line-height:1.65;color:var(--gray-700);margin:0 0 40px;max-width:700px\">When AURA requests a governed tool or action, Mezmo evaluates the request against the policy assigned to that connection. One-time approval applies only to that request. Policy changes create a new version, and decisions remain tied to the policy that evaluated them.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:20px\">\n        <x-import component-from-global-scope=\"MezmoDesignSystem_d27913.Card\" from=\"93385fd9-1a33-4095-bfbc-a7706f7c2d79#/_ds_bundle.js\" hint-size=\"100%,150px\">\n          <x-import component-from-global-scope=\"MezmoDesignSystem_d27913.Badge\" from=\"93385fd9-1a33-4095-bfbc-a7706f7c2d79#/_ds_bundle.js\" tone=\"success\" hint-size=\"60px,20px\">Allow<\u002Fx-import>\n          <div style=\"font-size:15px;font-weight:300;line-height:1.6;color:var(--gray-700);margin-top:12px\">The request matches standing policy and can proceed.<\u002Fdiv>\n        <\u002Fx-import>\n        <x-import component-from-global-scope=\"MezmoDesignSystem_d27913.Card\" from=\"93385fd9-1a33-4095-bfbc-a7706f7c2d79#/_ds_bundle.js\" hint-size=\"100%,150px\">\n          <x-import component-from-global-scope=\"MezmoDesignSystem_d27913.Badge\" from=\"93385fd9-1a33-4095-bfbc-a7706f7c2d79#/_ds_bundle.js\" tone=\"warning\" hint-size=\"120px,20px\">Require approval<\u002Fx-import>\n          <div style=\"font-size:15px;font-weight:300;line-height:1.6;color:var(--gray-700);margin-top:12px\">A human reviews the exact request before it executes.<\u002Fdiv>\n        <\u002Fx-import>\n        <x-import component-from-global-scope=\"MezmoDesignSystem_d27913.Card\" from=\"93385fd9-1a33-4095-bfbc-a7706f7c2d79#/_ds_bundle.js\" hint-size=\"100%,150px\">\n          <x-import component-from-global-scope=\"MezmoDesignSystem_d27913.Badge\" from=\"93385fd9-1a33-4095-bfbc-a7706f7c2d79#/_ds_bundle.js\" tone=\"danger\" hint-size=\"60px,20px\">Deny<\u002Fx-import>\n          <div style=\"font-size:15px;font-weight:300;line-height:1.6;color:var(--gray-700);margin-top:12px\">The request is blocked before execution.<\u002Fdiv>\n        <\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PROGRESSIVE AUTONOMY -->\n  <section style=\"padding:88px 40px;background:var(--gray-50)\">\n    <div style=\"max-width:1120px;margin:0 auto\">\n      <div style=\"font-size:13px;font-weight:500;color:var(--gray-700);margin-bottom:14px\">PROGRESSIVE AUTONOMY<\u002Fdiv>\n      <h2 style=\"font-size:34px;font-weight:600;color:var(--gray-950);margin:0 0 20px;max-width:680px\">Start narrow. Expand autonomy one workflow at a time.<\u002Fh2>\n      <p style=\"font-size:17px;font-weight:300;line-height:1.65;color:var(--gray-700);margin:0 0 40px;max-width:700px\">Today, Mezmo Governance operates at the individual tool-call level. Teams define what an agent can request and what must happen before AURA executes it.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:14px 40px;margin-bottom:28px\">\n        <div style=\"display:flex;gap:12px;align-items:flex-start\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" style=\"flex:0 0 auto;margin-top:2px;color:var(--purple-600)\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><div style=\"font-size:15px;font-weight:300;color:var(--gray-800)\">Tool access — define which tools or namespaces an agent can use<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:flex-start\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" style=\"flex:0 0 auto;margin-top:2px;color:var(--purple-600)\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><div style=\"font-size:15px;font-weight:300;color:var(--gray-800)\">Arguments — constrain requests by target, scope, or value<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:flex-start\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" style=\"flex:0 0 auto;margin-top:2px;color:var(--purple-600)\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><div style=\"font-size:15px;font-weight:300;color:var(--gray-800)\">Approval paths — require human review for sensitive actions<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:flex-start\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" style=\"flex:0 0 auto;margin-top:2px;color:var(--purple-600)\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><div style=\"font-size:15px;font-weight:300;color:var(--gray-800)\">Denied actions — block requests that should never proceed<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:flex-start\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" style=\"flex:0 0 auto;margin-top:2px;color:var(--purple-600)\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><div style=\"font-size:15px;font-weight:300;color:var(--gray-800)\">Policy versions — keep every decision tied to the policy version that made it<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:flex-start\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" style=\"flex:0 0 auto;margin-top:2px;color:var(--purple-600)\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><div style=\"font-size:15px;font-weight:300;color:var(--gray-800)\">Connections — attach active policies to registered AURA connections<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:flex-start\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" style=\"flex:0 0 auto;margin-top:2px;color:var(--purple-600)\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><div style=\"font-size:15px;font-weight:300;color:var(--gray-800)\">Audit outcomes — keep a record of allowed, approved, and denied requests<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- HOW IT WORKS -->\n  <section style=\"padding:88px 40px\">\n    <div style=\"max-width:1120px;margin:0 auto\">\n      <div style=\"font-size:13px;font-weight:500;color:var(--gray-700);margin-bottom:14px\">HOW IT WORKS<\u002Fdiv>\n      <h2 style=\"font-size:34px;font-weight:600;color:var(--gray-950);margin:0 0 12px;max-width:680px\">The policy decision comes from Mezmo. Enforcement stays in your environment.<\u002Fh2>\n      <p style=\"font-size:16px;font-weight:300;color:var(--gray-700);margin:0 0 48px;max-width:640px\">Every governed call follows the same loop.<\u002Fp>\n\n      <div ref=\"{{ stepsContainerRef }}\" style=\"display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:56px\">\n        <div style=\"position:relative;width:100%;max-width:480px;aspect-ratio:1/1;flex:0 0 auto;margin:0 auto\">\n          <svg sc-camel-view-box=\"0 0 520 520\" style=\"position:absolute;inset:0;width:100%;height:100%;overflow:visible\">\n            <circle cx=\"260\" cy=\"260\" r=\"200\" fill=\"none\" stroke=\"var(--gray-200)\" stroke-width=\"2\"><\u002Fcircle>\n            <g fill=\"var(--purple-300)\">\n              <path d=\"M0,-7 L12,0 L0,7 Z\" transform=\"translate(377.6,98.2) rotate(36)\"><\u002Fpath>\n              <path d=\"M0,-7 L12,0 L0,7 Z\" transform=\"translate(450.2,321.8) rotate(108)\"><\u002Fpath>\n              <path d=\"M0,-7 L12,0 L0,7 Z\" transform=\"translate(260,460) rotate(180)\"><\u002Fpath>\n              <path d=\"M0,-7 L12,0 L0,7 Z\" transform=\"translate(69.8,321.8) rotate(252)\"><\u002Fpath>\n              <path d=\"M0,-7 L12,0 L0,7 Z\" transform=\"translate(142.4,98.2) rotate(324)\"><\u002Fpath>\n            <\u002Fg>\n          <\u002Fsvg>\n          <div style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:120px;pointer-events:none\">\n            <div style=\"font-size:12px;font-weight:500;color:var(--gray-500);letter-spacing:0.02em\">REQUEST<\u002Fdiv>\n            <svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" style=\"margin:6px auto;color:var(--gray-400);display:block\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M19 12l-7 7-7-7\"><\u002Fpath><\u002Fsvg>\n            <div style=\"font-size:12px;font-weight:500;color:var(--gray-500);letter-spacing:0.02em\">RECORD<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-mouse-enter=\"{{ node1Enter }}\" sc-camel-on-mouse-leave=\"{{ nodeLeave }}\" sc-camel-on-click=\"{{ node1Click }}\" style=\"{{ node1Style }}position:absolute;left:50%;top:11.54%;width:132px;height:132px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:1px solid var(--purple-200);box-shadow:var(--shadow-marketing-md);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;box-sizing:border-box;cursor:pointer\">\n            <div style=\"width:28px;height:28px;border-radius:999px;background:var(--purple-100);color:var(--purple-700);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;margin-bottom:8px\">01<\u002Fdiv>\n            <div style=\"font-size:13px;font-weight:600;color:var(--gray-950);line-height:1.3\">Runs in your environment<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-mouse-enter=\"{{ node2Enter }}\" sc-camel-on-mouse-leave=\"{{ nodeLeave }}\" sc-camel-on-click=\"{{ node2Click }}\" style=\"{{ node2Style }}position:absolute;left:86.58%;top:38.12%;width:132px;height:132px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:1px solid var(--purple-200);box-shadow:var(--shadow-marketing-md);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;box-sizing:border-box;cursor:pointer\">\n            <div style=\"width:28px;height:28px;border-radius:999px;background:var(--purple-100);color:var(--purple-700);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;margin-bottom:8px\">02<\u002Fdiv>\n            <div style=\"font-size:13px;font-weight:600;color:var(--gray-950);line-height:1.3\">Sends a governance request<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-mouse-enter=\"{{ node3Enter }}\" sc-camel-on-mouse-leave=\"{{ nodeLeave }}\" sc-camel-on-click=\"{{ node3Click }}\" style=\"{{ node3Style }}position:absolute;left:72.62%;top:81.12%;width:132px;height:132px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:1px solid var(--purple-200);box-shadow:var(--shadow-marketing-md);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;box-sizing:border-box;cursor:pointer\">\n            <div style=\"width:28px;height:28px;border-radius:999px;background:var(--purple-100);color:var(--purple-700);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;margin-bottom:8px\">03<\u002Fdiv>\n            <div style=\"font-size:13px;font-weight:600;color:var(--gray-950);line-height:1.3\">Mezmo returns a decision<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-mouse-enter=\"{{ node4Enter }}\" sc-camel-on-mouse-leave=\"{{ nodeLeave }}\" sc-camel-on-click=\"{{ node4Click }}\" style=\"{{ node4Style }}position:absolute;left:27.38%;top:81.12%;width:132px;height:132px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:1px solid var(--purple-200);box-shadow:var(--shadow-marketing-md);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;box-sizing:border-box;cursor:pointer\">\n            <div style=\"width:28px;height:28px;border-radius:999px;background:var(--purple-100);color:var(--purple-700);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;margin-bottom:8px\">04<\u002Fdiv>\n            <div style=\"font-size:13px;font-weight:600;color:var(--gray-950);line-height:1.3\">Enforces the decision locally<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-mouse-enter=\"{{ node5Enter }}\" sc-camel-on-mouse-leave=\"{{ nodeLeave }}\" sc-camel-on-click=\"{{ node5Click }}\" style=\"{{ node5Style }}position:absolute;left:13.42%;top:38.12%;width:132px;height:132px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:1px solid var(--purple-200);box-shadow:var(--shadow-marketing-md);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;box-sizing:border-box;cursor:pointer\">\n            <div style=\"width:28px;height:28px;border-radius:999px;background:var(--purple-100);color:var(--purple-700);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;margin-bottom:8px\">05<\u002Fdiv>\n            <div style=\"font-size:13px;font-weight:600;color:var(--gray-950);line-height:1.3\">Keeps the audit record<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"width:100%;max-width:640px;min-height:92px;border:1px solid var(--gray-200);border-radius:var(--radius-marketing-default);background:var(--gray-50);padding:20px 24px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center\">\n          <sc-if value=\"{{ hasActiveStep }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n              <div style=\"font-size:15px;font-weight:600;color:var(--gray-950);margin-bottom:4px\">{{ activeTitle }}<\u002Fdiv>\n              <div style=\"font-size:14px;font-weight:300;line-height:1.6;color:var(--gray-700)\">{{ activeDesc }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noActiveStep }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font-size:14px;font-weight:300;color:var(--gray-500)\">Hover or tap a step to see what happens there<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:20px;margin-top:40px\">\n        <x-import component-from-global-scope=\"MezmoDesignSystem_d27913.Card\" from=\"93385fd9-1a33-4095-bfbc-a7706f7c2d79#/_ds_bundle.js\" hint-size=\"100%,160px\">\n          <div style=\"font-size:16px;font-weight:600;color:var(--gray-950);margin-bottom:8px\">No rule matches? Fallthrough decides, on purpose<\u002Fdiv>\n          <div style=\"font-size:14px;font-weight:300;line-height:1.6;color:var(--gray-700)\">Every policy sets a fallthrough for requests no rule covers: deny outright, send for approval, or allow. There's no default — denying, routing to a human, or waving a call through is too consequential to inherit silently, so it's chosen explicitly when the policy is created.<\u002Fdiv>\n        <\u002Fx-import>\n        <x-import component-from-global-scope=\"MezmoDesignSystem_d27913.Card\" from=\"93385fd9-1a33-4095-bfbc-a7706f7c2d79#/_ds_bundle.js\" hint-size=\"100%,160px\">\n          <div style=\"font-size:16px;font-weight:600;color:var(--gray-950);margin-bottom:8px\">Unreachable connections fail closed, not silently open<\u002Fdiv>\n          <div style=\"font-size:14px;font-weight:300;line-height:1.6;color:var(--gray-700)\">Only decisions already cached under standing Allow policy keep executing. New or unrecognized requests are blocked until the connection to Mezmo recovers — nothing new is approved simply because the governance service can't be reached.<\u002Fdiv>\n        <\u002Fx-import>\n        <x-import component-from-global-scope=\"MezmoDesignSystem_d27913.Card\" from=\"93385fd9-1a33-4095-bfbc-a7706f7c2d79#/_ds_bundle.js\" hint-size=\"100%,160px\">\n          <div style=\"font-size:16px;font-weight:600;color:var(--gray-950);margin-bottom:8px\">Policy is config, not bespoke policy code<\u002Fdiv>\n          <div style=\"font-size:14px;font-weight:300;line-height:1.6;color:var(--gray-700)\">Policies are TOML documents versioned alongside the rest of AURA's configuration, so teams can review policy changes through the same engineering workflows they already use.<\u002Fdiv>\n        <\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PRODUCT UI -->\n  <section style=\"padding:88px 40px;background:var(--gray-50)\">\n    <div style=\"max-width:1120px;margin:0 auto\">\n      <div style=\"font-size:13px;font-weight:500;color:var(--gray-700);margin-bottom:14px\">THE POLICY BUILDER<\u002Fdiv>\n      <h2 style=\"font-size:34px;font-weight:600;color:var(--gray-950);margin:0 0 12px;max-width:680px\">Set the boundaries before agents act<\u002Fh2>\n      <p style=\"font-size:16px;font-weight:300;color:var(--gray-700);margin:0 0 40px;max-width:640px\">Pick what a rule matches, choose its outcome, and define what happens when nothing matches. Rules and fallthrough are configured directly in the product.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(2,minmax(320px,1fr));gap:24px\">\n        <div>\n          <img src=\"7760141e-dfd0-4f78-96dc-6f220784583f\" alt=\"Policy builder rule editor showing a rule matching on tool name kubectl.rollout_restart with a namespace=prod argument constraint and a Require Approval outcome\" style=\"width:100%;display:block;border:1px solid var(--gray-200);border-radius:var(--radius-marketing-sm);box-shadow:var(--shadow-marketing-md)\">\n          <div style=\"font-size:14px;font-weight:300;color:var(--gray-700);margin-top:12px\">A rule matches on tool name, namespace, or a tool-call argument, then resolves to allow, require approval, or deny.<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <img src=\"fc9a02a0-660a-41f1-9310-9b9c11e36aeb\" alt=\"Fallthrough step showing three options for unmatched calls: deny outright, send for approval, or allow\" style=\"width:100%;display:block;border:1px solid var(--gray-200);border-radius:var(--radius-marketing-sm);box-shadow:var(--shadow-marketing-md)\">\n          <div style=\"font-size:14px;font-weight:300;color:var(--gray-700);margin-top:12px\">Fallthrough is chosen explicitly for every policy — there's no preselected option.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- EXAMPLE -->\n  <section style=\"padding:88px 40px\">\n    <div style=\"max-width:1120px;margin:0 auto\">\n      <div style=\"font-size:13px;font-weight:500;color:var(--gray-700);margin-bottom:14px\">EXAMPLE<\u002Fdiv>\n      <h2 style=\"font-size:34px;font-weight:600;color:var(--gray-950);margin:0 0 20px;max-width:700px\">Let the agent investigate. Put the production change behind approval.<\u002Fh2>\n      <p style=\"font-size:17px;font-weight:300;line-height:1.65;color:var(--gray-700);margin:0 0 32px;max-width:700px\">An SRE agent investigates a production issue and recommends scaling a Kubernetes resource in <span style=\"font-family:var(--font-mono)\">payments-prod<\u002Fspan>. Mezmo evaluates the requested tool, namespace, and arguments.<\u002Fp>\n\n      <x-import component-from-global-scope=\"MezmoDesignSystem_d27913.Card\" from=\"93385fd9-1a33-4095-bfbc-a7706f7c2d79#/_ds_bundle.js\" hint-size=\"100%,260px\">\n        <div style=\"display:flex;flex-direction:column;gap:16px;margin-bottom:20px\">\n          <div style=\"display:flex;gap:12px;align-items:baseline\">\n            <x-import component-from-global-scope=\"MezmoDesignSystem_d27913.Badge\" from=\"93385fd9-1a33-4095-bfbc-a7706f7c2d79#/_ds_bundle.js\" tone=\"success\" hint-size=\"60px,20px\">Allow<\u002Fx-import>\n            <div style=\"font-size:15px;font-weight:300;color:var(--gray-800)\">Read-only inspection proceeds under standing policy<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\">\n            <x-import component-from-global-scope=\"MezmoDesignSystem_d27913.Badge\" from=\"93385fd9-1a33-4095-bfbc-a7706f7c2d79#/_ds_bundle.js\" tone=\"warning\" hint-size=\"120px,20px\">Require approval<\u002Fx-import>\n            <div style=\"font-size:15px;font-weight:300;color:var(--gray-800)\">Scaling the production resource pauses for human review before execution<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\">\n            <x-import component-from-global-scope=\"MezmoDesignSystem_d27913.Badge\" from=\"93385fd9-1a33-4095-bfbc-a7706f7c2d79#/_ds_bundle.js\" tone=\"danger\" hint-size=\"60px,20px\">Deny<\u002Fx-import>\n            <div style=\"font-size:15px;font-weight:300;color:var(--gray-800)\">A request outside the allowed namespace is denied by an explicit rule — not by an assumed default<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\">\n            <x-import component-from-global-scope=\"MezmoDesignSystem_d27913.Badge\" from=\"93385fd9-1a33-4095-bfbc-a7706f7c2d79#/_ds_bundle.js\" tone=\"info\" hint-size=\"60px,20px\">Record<\u002Fx-import>\n            <div style=\"font-size:15px;font-weight:300;color:var(--gray-800)\">The request, decision, approver, policy version, execution facts, and outcome are retained<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid var(--gray-100);padding-top:16px;font-size:15px;font-weight:600;color:var(--gray-950)\">The SRE reviews the production-changing request, not every step the agent took to get there.<\u002Fdiv>\n      <\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ARCHITECTURE -->\n  <section style=\"padding:88px 40px;background:var(--gray-50)\">\n    <div style=\"max-width:1120px;margin:0 auto\">\n      <div style=\"font-size:13px;font-weight:500;color:var(--gray-700);margin-bottom:14px\">ARCHITECTURE<\u002Fdiv>\n      <h2 style=\"font-size:34px;font-weight:600;color:var(--gray-950);margin:0 0 20px;max-width:680px\">Built for customer-owned infrastructure<\u002Fh2>\n      <p style=\"font-size:17px;font-weight:300;line-height:1.65;color:var(--gray-700);margin:0 0 28px;max-width:700px\">AURA runs in your environment, under your control, including customer-controlled and air-gapped deployments. Mezmo registers a governance connection to the customer-run AURA installation and returns policy decisions for governed requests. AURA enforces those decisions where the tools actually run.<\u002Fp>\n\n      <div style=\"display:flex;flex-wrap:wrap;gap:24px;margin-bottom:36px\">\n        <div style=\"font-size:15px;font-weight:600;color:var(--gray-950)\">You keep control of your:<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px 24px;font-size:15px;font-weight:300;color:var(--gray-700)\">\n          <span>Runtime<\u002Fspan><span>Tools<\u002Fspan><span>Models<\u002Fspan><span>Telemetry<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;align-items:center;flex-wrap:nowrap;gap:12px;overflow-x:auto;padding-bottom:4px\">\n        <div style=\"padding:16px 18px;border:1px solid var(--gray-300);border-radius:var(--radius-marketing-sm);background:#fff;font-size:14px;font-weight:600;color:var(--gray-950);white-space:nowrap\">AURA in your environment<\u002Fdiv>\n        <span style=\"color:var(--gray-400);font-size:18px\">→<\u002Fspan>\n        <div style=\"padding:16px 18px;border:1px solid var(--gray-300);border-radius:var(--radius-marketing-sm);background:#fff;font-size:14px;font-weight:600;color:var(--gray-950);white-space:nowrap\">Governance request<\u002Fdiv>\n        <span style=\"color:var(--gray-400);font-size:18px\">→<\u002Fspan>\n        <div style=\"padding:16px 18px;border:1px solid var(--purple-300);border-radius:var(--radius-marketing-sm);background:var(--purple-50);font-size:14px;font-weight:600;color:var(--purple-800);white-space:nowrap\">Mezmo policy decision<\u002Fdiv>\n        <span style=\"color:var(--gray-400);font-size:18px\">→<\u002Fspan>\n        <div style=\"padding:16px 18px;border:1px solid var(--gray-300);border-radius:var(--radius-marketing-sm);background:#fff;font-size:14px;font-weight:600;color:var(--gray-950);white-space:nowrap\">Local enforcement by AURA<\u002Fdiv>\n        <span style=\"color:var(--gray-400);font-size:18px\">→<\u002Fspan>\n        <div style=\"padding:16px 18px;border:1px solid var(--purple-300);border-radius:var(--radius-marketing-sm);background:var(--purple-50);font-size:14px;font-weight:600;color:var(--purple-800);white-space:nowrap\">Audit record in Mezmo<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:40px;background:#fff;border:1px solid var(--gray-100);border-radius:var(--radius-product-lg);box-shadow:var(--shadow-product-md);overflow:hidden\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--gray-100);background:var(--gray-50)\">\n          <span style=\"font-size:13px;font-weight:600;color:var(--gray-950)\">Audit record<\u002Fspan>\n          <span style=\"font-size:12px;font-weight:300;color:var(--gray-500)\">Connection: prod-us-east<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:110px 1fr 90px 100px;padding:10px 20px;font-size:11px;font-weight:500;color:var(--gray-500);border-bottom:1px solid var(--gray-100)\">\n          <span>TIME<\u002Fspan><span>REQUEST<\u002Fspan><span>POLICY<\u002Fspan><span>OUTCOME<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:110px 1fr 90px 100px;padding:12px 20px;font-size:13px;color:var(--gray-800);border-bottom:1px solid var(--gray-100);align-items:center\">\n          <span style=\"font-family:var(--font-mono);color:var(--gray-500)\">14:02:11<\u002Fspan>\n          <span style=\"font-family:var(--font-mono)\">k8s.scale_deployment · payments-prod<\u002Fspan>\n          <span style=\"font-family:var(--font-mono);color:var(--gray-500)\">v14<\u002Fspan>\n          <span style=\"display:inline-flex;width:fit-content;font-size:12px;font-weight:500;padding:2px 8px;border-radius:var(--radius-product-xs);background:var(--green-100);color:var(--green-800)\">Allow<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:110px 1fr 90px 100px;padding:12px 20px;font-size:13px;color:var(--gray-800);border-bottom:1px solid var(--gray-100);align-items:center\">\n          <span style=\"font-family:var(--font-mono);color:var(--gray-500)\">14:03:47<\u002Fspan>\n          <span style=\"font-family:var(--font-mono)\">k8s.delete_namespace · payments-prod<\u002Fspan>\n          <span style=\"font-family:var(--font-mono);color:var(--gray-500)\">v14<\u002Fspan>\n          <span style=\"display:inline-flex;width:fit-content;font-size:12px;font-weight:500;padding:2px 8px;border-radius:var(--radius-product-xs);background:var(--red-100);color:var(--red-800)\">Deny<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:110px 1fr 90px 100px;padding:12px 20px;font-size:13px;color:var(--gray-800);align-items:center\">\n          <span style=\"font-family:var(--font-mono);color:var(--gray-500)\">14:05:02<\u002Fspan>\n          <span style=\"font-family:var(--font-mono)\">pagerduty.create_incident<\u002Fspan>\n          <span style=\"font-family:var(--font-mono);color:var(--gray-500)\">v9<\u002Fspan>\n          <span style=\"display:inline-flex;width:fit-content;font-size:12px;font-weight:500;padding:2px 8px;border-radius:var(--radius-product-xs);background:var(--yellow-100);color:var(--yellow-800)\">Approved<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- WHY THIS MATTERS -->\n  <section style=\"padding:88px 40px\">\n    <div style=\"max-width:1120px;margin:0 auto\">\n      <div style=\"font-size:13px;font-weight:500;color:var(--gray-700);margin-bottom:14px\">WHY THIS MATTERS<\u002Fdiv>\n      <h2 style=\"font-size:34px;font-weight:600;color:var(--gray-950);margin:0 0 44px;max-width:680px\">Put human attention where the risk is<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:40px\">\n        <div>\n          <svg sc-camel-view-box=\"0 0 24 24\" width=\"28\" height=\"28\" style=\"color:var(--purple-700);margin-bottom:16px\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 8V6a5 5 0 0 0-10 0v2\"><\u002Fpath><rect x=\"4\" y=\"8\" width=\"16\" height=\"12\" rx=\"2\"><\u002Frect><\u002Fsvg>\n          <div style=\"font-size:17px;font-weight:600;color:var(--gray-950);margin-bottom:6px\">Let routine work keep moving<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:300;font-style:italic;line-height:1.6;color:var(--gray-700)\">Standing policy allows known-safe requests without waiting for manual approval.<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <svg sc-camel-view-box=\"0 0 24 24\" width=\"28\" height=\"28\" style=\"color:var(--purple-700);margin-bottom:16px\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 3\"><\u002Fpath><\u002Fsvg>\n          <div style=\"font-size:17px;font-weight:600;color:var(--gray-950);margin-bottom:6px\">Put approval on the dangerous edge<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:300;font-style:italic;line-height:1.6;color:var(--gray-700)\">Sensitive production actions stop for review without blocking the investigation around them.<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <svg sc-camel-view-box=\"0 0 24 24\" width=\"28\" height=\"28\" style=\"color:var(--purple-700);margin-bottom:16px\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 12l2 2 4-4\"><\u002Fpath><path d=\"M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z\"><\u002Fpath><\u002Fsvg>\n          <div style=\"font-size:17px;font-weight:600;color:var(--gray-950);margin-bottom:6px\">Know why an action was allowed<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:300;font-style:italic;line-height:1.6;color:var(--gray-700)\">Each decision remains connected to its request, policy version, approval, execution facts, and outcome.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CTA -->\n  <section style=\"position:relative;padding:96px 40px;background:var(--gray-950);overflow:hidden\">\n    <svg sc-camel-view-box=\"0 0 21 21\" style=\"position:absolute;bottom:-30px;left:60px;width:140px;height:140px;color:var(--purple-800);opacity:0.5;pointer-events:none\"><path d=\"M9.00416 19.4372L6.29857 13.7948L0.656162 11.0892C-0.218721 10.6691 -0.218721 9.42425 0.656162 9.00415L6.29857 6.29857L9.00416 0.656161C9.42425 -0.21872 10.6691 -0.21872 11.0892 0.656161L13.7948 6.29857L19.4372 9.00415C20.3121 9.42425 20.3121 10.6691 19.4372 11.0892L13.7948 13.7948L11.0892 19.4372C10.6691 20.3121 9.42425 20.3121 9.00416 19.4372Z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg>\n    <div style=\"position:relative;max-width:700px;margin:0 auto;text-align:center\">\n      <h2 style=\"font-size:34px;font-weight:600;color:#fff;margin:0 0 18px\">Give agents production access without giving them unrestricted authority.<\u002Fh2>\n      <p style=\"font-size:17px;font-weight:300;line-height:1.6;color:var(--gray-400);margin:0 0 36px\">Deploy AURA in your environment. Define what can proceed, what needs approval, and what should be denied before an agent acts.<\u002Fp>\n      <div style=\"display:flex;gap:14px;justify-content:center;flex-wrap:wrap\">\n        <x-import component-from-global-scope=\"MezmoDesignSystem_d27913.Button\" from=\"93385fd9-1a33-4095-bfbc-a7706f7c2d79#/_ds_bundle.js\" variant=\"solid\" size=\"lg\" hint-size=\"150px,48px\">\n          <a href=\"https://mezmo.com\" style=\"color:inherit;text-decoration:none\">See how governed SRE agents work<\u002Fa>\n        <\u002Fx-import>\n        <x-import component-from-global-scope=\"MezmoDesignSystem_d27913.Button\" from=\"93385fd9-1a33-4095-bfbc-a7706f7c2d79#/_ds_bundle.js\" variant=\"outline\" size=\"lg\" hint-size=\"150px,48px\" style=\"background:transparent;border-color:var(--gray-600);color:#fff\">\n          <a href=\"https://mezmo.com/contact\" style=\"color:inherit;text-decoration:none\">Talk to us about your agent workflow<\u002Fa>\n        <\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"padding:20px 40px 40px;text-align:center;font-size:14px;font-weight:600;color:var(--gray-950);letter-spacing:0.02em\">Your runtime. Your rules. Your production.<\u002Fdiv>\n  <footer style=\"padding:8px 40px 28px;text-align:center;font-size:13px;font-weight:300;color:var(--gray-500)\">© 2026 Mezmo<\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { stepsVisible: false, hoverStep: null, pinStep: null };\n  stepData = [\n    { title: 'AURA runs in your environment', desc: 'You install, deploy, configure, restart, and upgrade AURA. Mezmo does not operate your AURA runtime.' },\n    { title: 'AURA sends a governance request', desc: 'The request includes the information needed to evaluate the requested action, including the tool name and arguments.' },\n    { title: 'Mezmo returns a decision', desc: 'A matching rule allows, denies, or routes the request for human approval. If no rule matches, the policy\\'s fallthrough setting decides — deny outright, send for approval, or allow. Fallthrough has no default; it\\'s set explicitly per policy.' },\n    { title: 'AURA enforces the decision locally', desc: 'AURA executes only the permitted tool call in your environment.' },\n    { title: 'Mezmo keeps the audit record', desc: 'The policy, decision, approval, execution facts, and outcome are recorded.' },\n  ];\n\n  stepsContainerRef = (el) => {\n    if (!el || this._stepsObserved) return;\n    this._stepsObserved = true;\n    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (reduced) { this.setState({ stepsVisible: true, pinStep: 0 }); return; }\n    const obs = new IntersectionObserver((entries) => {\n      if (entries[0].isIntersecting) {\n        this.setState({ stepsVisible: true });\n        this.startAutoCycle();\n        obs.disconnect();\n      }\n    }, { threshold: 0.2 });\n    obs.observe(el);\n  };\n\n  startAutoCycle() {\n    if (this._cycleTimer) return;\n    this.setState({ pinStep: 0 });\n    this._cycleTimer = setInterval(() => {\n      if (this.state.hoverStep !== null) return;\n      this.setState(s => ({ pinStep: (s.pinStep + 1) % 5 }));\n    }, 2200);\n  }\n\n  componentWillUnmount() {\n    if (this._cycleTimer) clearInterval(this._cycleTimer);\n  }\n\n  stepStyle(i) {\n    const visible = this.state.stepsVisible;\n    const delay = i * 90;\n    return `opacity:${visible ? 1 : 0};transform:translateY(${visible ? 0 : 8}px);transition:opacity 420ms cubic-bezier(0.22,0.61,0.36,1) ${delay}ms,transform 420ms cubic-bezier(0.22,0.61,0.36,1) ${delay}ms;`;\n  }\n\n  nodeStyle(i) {\n    const visible = this.state.stepsVisible;\n    const delay = i * 110;\n    const active = this.activeStep() === i;\n    const scale = !visible ? 0.85 : active ? 1.06 : 1;\n    const border = active ? 'var(--purple-500)' : 'var(--purple-200)';\n    return `opacity:${visible ? 1 : 0};transform:translate(-50%,-50%) scale(${scale});transition:opacity 420ms cubic-bezier(0.22,0.61,0.36,1) ${delay}ms,transform 220ms cubic-bezier(0.22,0.61,0.36,1),border-color 220ms;border-color:${border};`;\n  }\n\n  activeStep() {\n    return this.state.hoverStep ?? this.state.pinStep;\n  }\n\n  makeEnter(i) { return () => this.setState({ hoverStep: i }); }\n  makeClick(i) { return () => this.setState({ pinStep: i }); }\n\n  renderVals() {\n    const active = this.activeStep();\n    const hasActive = active !== null && active !== undefined;\n    return {\n      stepsContainerRef: this.stepsContainerRef,\n      node1Style: this.nodeStyle(0),\n      node2Style: this.nodeStyle(1),\n      node3Style: this.nodeStyle(2),\n      node4Style: this.nodeStyle(3),\n      node5Style: this.nodeStyle(4),\n      node1Enter: this.makeEnter(0),\n      node2Enter: this.makeEnter(1),\n      node3Enter: this.makeEnter(2),\n      node4Enter: this.makeEnter(3),\n      node5Enter: this.makeEnter(4),\n      node1Click: this.makeClick(0),\n      node2Click: this.makeClick(1),\n      node3Click: this.makeClick(2),\n      node4Click: this.makeClick(3),\n      node5Click: this.makeClick(4),\n      nodeLeave: () => this.setState({ hoverStep: null }),\n      hasActiveStep: hasActive,\n      noActiveStep: !hasActive,\n      activeTitle: hasActive ? this.stepData[active].title : '',\n      activeDesc: hasActive ? this.stepData[active].desc : '',\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
