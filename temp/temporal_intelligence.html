document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"d1d7f5b8-abdb-4727-b756-b84658fa3348\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"06b40334-4281-4a09-8758-6732a5220775\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"461a4754-06e6-4d38-ba71-6a4223308caf\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"7593cbcc-8813-42a9-947c-dc6ae8d57798\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"d4ca3942-4c65-4522-811b-fecde8b5b082\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"41522f06-96cd-4c07-827c-6f52f1ff545a\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"d1d7f5b8-abdb-4727-b756-b84658fa3348\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #0088b0;\n  --color-accent-2: #d6006c;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #e9f8ff;\n  --color-accent-200: #cbeeff;\n  --color-accent-300: #99e0ff;\n  --color-accent-400: #62c5ee;\n  --color-accent-500: #38a6cf;\n  --color-accent-600: #1186ac;\n  --color-accent-700: #006786;\n  --color-accent-800: #004961;\n  --color-accent-900: #0a303e;\n\n  --color-accent-2-100: #fff1f4;\n  --color-accent-2-200: #ffdee6;\n  --color-accent-2-300: #ffc0d0;\n  --color-accent-2-400: #ff90b1;\n  --color-accent-2-500: #ff458e;\n  --color-accent-2-600: #d82071;\n  --color-accent-2-700: #aa0b56;\n  --color-accent-2-800: #790e3d;\n  --color-accent-2-900: #4b1528;\n\n  /* The third process ink — review round 3: the deck's print treatments\n     (the CMYK separation and the misregistered plate numerals below) need\n     the full four-color set. Cyan and magenta are the system's own accents;\n     this yellow completes them, muted to the same press-ink register. A\n     print treatment color, not an interface accent — body copy and chrome\n     never take it. */\n  --color-process-yellow: #edbb00;\n\n  --font-heading: \"Source Serif 4\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Source Serif 4\", system-ui, sans-serif;\n\n  --space-1: 5.0px;\n  --space-2: 10.0px;\n  --space-3: 15.0px;\n  --space-4: 20.0px;\n  --space-6: 30.0px;\n  --space-8: 40.0px;\n\n  --radius-sm: 1px;\n  --radius-md: 2px;\n  --radius-lg: 4px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.halftone{position:relative;filter:grayscale(0.35) contrast(1.15);overflow:hidden}\n.halftone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The four-color separation treatment (review round 3) — a photograph\n   printed as its misregistered process plates, after the Catalogue Three\n   grammar. Markup: a figure.cmyk holding five copies of the image — the\n   first is the layout sizer (hidden), then one per plate, each tagged\n   .sep-c/.sep-m/.sep-y/.sep-k. The plates are extracted live by the SVG\n   feColorMatrix filters in print-plates.js, the system's own defs —\n   inlined in the compiled bundle every template page loads, and a\n   page that links styles.css directly adds\n   <script src=\"print-plates.js\"><\u002Fscript> itself (the defs must be in\n   the document: a data-URI filter reference would not survive Chromium,\n   and external-file references are unreliable across engines) — nudged\n   a few pixels out of register, and multiplied\n   onto the paper ground; the halftone dot screens the recombined print.\n   The plate offsets live with the deck's projection-scale CSS, since\n   misregistration is sized to the output. */\n.cmyk{position:relative;overflow:hidden;background:var(--color-bg)}\n.cmyk img:first-child{opacity:0} /* layout sizer AND the alt-bearing image — opacity\n  keeps it in the accessibility tree (visibility:hidden would drop the figure's only\n  description); fully transparent, it adds nothing to the multiply backdrop */\n.cmyk img+img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}\n.cmyk .sep-c{filter:url(#sep-c)}\n.cmyk .sep-m{filter:url(#sep-m)}\n.cmyk .sep-y{filter:url(#sep-y)}\n.cmyk .sep-k{filter:url(#sep-k)}\n.cmyk::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The one-image separation (review round 9, promoted from the deck in the\n   landing divergence) — the same four plates as ONE compound filter,\n   #sep-all in print-plates.js, for a single swappable image: a .print\n   wrapper inside the figure holds one <image-slot>, and the filter\n   extracts, offsets and multiplies the plates live from whatever the slot\n   shows. Markup: figure.cmyk > .print > image-slot (the page sizes the\n   .print — aspect-ratio, or absolute fill for bleeds). Hover resolves\n   the print into the photograph — the pressman checking registration on\n   the light table — so the source shows crisp and any swap chrome stays\n   legible; only the reduced-motion fallback below still lifts as a\n   single cut (a url() filter cannot CSS-transition; the press driver\n   animates the defs instead). */\n.cmyk .print{position:relative;width:100%;filter:url(#sep-all)}\n/* no hover end-state swap: the press driver (print-plates.js) eases the\n   plates into register while purifying their inks to the pure-process\n   separation on the same curve, so the converged four-plate merge IS\n   the photograph (their multiply equals SourceGraphic by construction)\n   — no cut anywhere on the animated path */\n@media (prefers-reduced-motion: reduce), (hover: none), (pointer: coarse) {\n  .cmyk .print:hover{filter:none} /* without the driver (it stands down on\n    exactly these conditions), hover stays the old single cut to the\n    crisp source */\n}\n.cmyk .print image-slot{width:100%;height:100%;display:block}\n\n/* The plate numeral (review rounds 3-4) — display figures set as\n   misregistered process plates, the catalog's cover grammar. Review\n   round 4 (Barron): THREE plates — C, M, Y only, no black plate — so the\n   dark core comes entirely from the C×M×Y multiply overlap (the inks\n   product to exact black), with the fringes the registration drift; and\n   the spread pulled in by half (less jumbled: one figure with plate\n   fringes rather than figures sliding apart). Markup: a .cmyk-num holding\n   a .paper span (the white of the sheet: the glyph's union, built from\n   offset text-shadow copies) and three .plate spans. The construction\n   carries its own ground (--cmyk-num-ground, defaulting to paper) painted\n   on its padding box, so the multiply plates always have their backdrop\n   even inside an isolated stacking context (entrance animations); the\n   padding bleeds wider than any plate offset and the negative margin\n   hands the layout box back. Offsets are em-scaled to the glyph. The\n   .paper span carries the text once for assistive tech; the .plate spans\n   are aria-hidden repeats. */\n.cmyk-num{--cmyk-num-ground:var(--color-bg);\n  position:relative;width:fit-content;line-height:0.9;\n  font-feature-settings:\"pnum\" 1;\n  background:var(--cmyk-num-ground);padding:0.12em;margin:-0.12em}\n.cmyk-num .paper{color:var(--color-bg); /* the white of the sheet — always paper,\n  whatever the ground: the plates read as printed on paper even when the\n  surrounding page is ink */\n  text-shadow:0.036em 0.025em 0 var(--color-bg),-0.031em -0.023em 0 var(--color-bg)}\n.cmyk-num .plate{position:absolute;inset:0.12em;mix-blend-mode:multiply;\n  text-box:trim-both cap alphabetic /* the host trims to its cap box; each\n  absolute plate must trim its own line the same way, or its glyphs sit a\n  half-leading below the paper union */}\n.cmyk-num .plate-c{color:var(--color-accent)}\n\n/* The plate headline (divergence round 3, Barron: \"use both\" — the\n   photograph's plates AND the cover grammar's text plates, on the same\n   page). The same three-plate construction as .cmyk-num — paper span\n   carrying the real text, C/M/Y plate repeats, dark core from the\n   multiply overlap — at HALF the numeral's round-4 offsets: the serif's\n   display hairlines are thinner than the numeral strokes the spread was\n   measured on, and the full offsets swallow them whole (probed at the\n   hero's 80px — the fringes read as an anaglyph poster, not a breath\n   out of register) — recut for display\n   headlines that sit in running text blocks on the page's own paper:\n   no ground painting and no padding bleed (the numeral's ground exists\n   for isolated stacking contexts; a headline on the page multiplies\n   straight onto the sheet), no width:fit-content and no line-height\n   override (the host display class owns its metrics — apply this to\n   each .line, which is position:relative for its plates), and the\n   plates are inert to the hand (pointer-events/user-select none, so a\n   triple-click selects the headline once, not four times). Plates take\n   the same pointer lean as .cmyk-num. */\n.cmyk-head{position:relative}\n.cmyk-head .paper{color:var(--color-bg);\n  text-shadow:0.027em 0.0185em 0 var(--color-bg),-0.0245em -0.0175em 0 var(--color-bg)\n  /* the union's copies sit at the construction's halved plate offsets\n     PLUS the full lean (0.018+0.009 / 0.0125+0.006, and mirrored), so\n     the union still backs the plates at viewport-edge lean — invisible\n     on the page's own paper, load-bearing on any other ground */}\n.cmyk-head .plate{position:absolute;inset:0;mix-blend-mode:multiply;\n  pointer-events:none;user-select:none;\n  text-box:trim-both cap alphabetic /* match the host's trim, or the\n  plates sit a half-leading below the paper union */}\n.cmyk-head .plate-c{color:var(--color-accent)}\n.cmyk-head .plate-m{color:var(--color-accent-2);\n  translate:calc(0.018em + 0.009em*var(--press-nx, 0)) calc(0.0125em + 0.006em*var(--press-ny, 0))}\n.cmyk-head .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.0155em + 0.009em*var(--press-nx, 0)) calc(-0.0115em + 0.006em*var(--press-ny, 0))}\n.cmyk-num .plate-m{color:var(--color-accent-2);\n  translate:calc(0.036em + 0.018em*var(--press-nx, 0)) calc(0.025em + 0.0125em*var(--press-ny, 0))}\n.cmyk-num .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.031em + 0.018em*var(--press-nx, 0)) calc(-0.023em + 0.0125em*var(--press-ny, 0))}\n/* --press-nx/--press-ny: the pointer lean as a bare -1..1 factor,\n   published on :root by the press driver (print-plates.js) and zero\n   whenever the driver stands down. Each construction scales the lean to\n   its own spread (half of it, here as everywhere) so the moving plates\n   drift a breath toward the cursor and the C plate holds. */\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input::placeholder { color: color-mix(in srgb, var(--color-text) 65%, transparent); opacity: 1; }\n  /* explicit, measured: the browser default gray misses the 4.5:1 small-text bar on\n     the surface fill; 65% ink measures 4.8:1 there, still a step quieter than typed\n     text (opacity:1 overrides Firefox's default placeholder fade) */\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"56fa3dd4-73bc-4ecd-8ac8-becbe9a90e72\"><\u002Fscript>\n<style>\n  html, body { margin:0; padding:0; background:#fff; -webkit-text-size-adjust:100%; }\n  a { color: var(--color-accent-700); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--color-accent-700) 30%, transparent); }\n  a:hover { color: var(--color-accent-600); border-bottom-color: var(--color-accent-600); }\n  a:focus-visible, button:focus-visible, .gr-row:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n  ::selection { background: var(--color-accent-200); }\n  .gr-row { cursor: pointer; }\n  .gr-row:hover { background: var(--color-accent-100); }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<main style=\"font-family:var(--font-body); color:var(--color-text); background:#fff; padding:clamp(18px,3.4vw,36px) clamp(18px,4vw,52px) clamp(56px,8vw,88px); width:100%; max-width:1320px; box-sizing:border-box;\">\n\n  <div style=\"border-bottom:1px solid var(--color-text); padding-bottom:9px; display:flex; flex-wrap:wrap; gap:6px 18px; align-items:baseline; justify-content:space-between; font-size:11.5px; letter-spacing:.15em; text-transform:uppercase;\">\n    <span style=\"font-family:var(--font-heading); font-weight:600;\">Temporal Intelligence<\u002Fspan>\n    <span style=\"color:var(--color-neutral-700);\">ngrok · source 04 · updated 8 August 2026<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:16px; display:flex; flex-wrap:wrap; gap:10px 20px; align-items:center; justify-content:space-between;\">\n    <span style=\"font-size:13.5px;\"><a href=\"Ground Reality.dc.html\">← Ground Reality<\u002Fa><\u002Fspan>\n    <span style=\"display:flex; align-items:center; gap:12px;\">\n      <sc-if value=\"{{ copied }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--color-accent-700);\">Link copied<\u002Fspan>\n      <\u002Fsc-if>\n      <button class=\"btn btn-secondary\" type=\"button\" sc-camel-on-click=\"{{ share }}\" style=\"font-size:13px; padding:5px 12px; border:none; box-shadow:none; background:var(--color-accent-100); color:var(--color-accent-700);\" style-hover=\"background:var(--color-accent-200); color:var(--color-accent-700);\">Share<\u002Fbutton>\n    <\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"padding-top:clamp(24px,4vw,40px);\">\n    <div style=\"font-size:11.5px; letter-spacing:.15em; text-transform:uppercase; color:var(--color-accent-700);\">How your market is moving<\u002Fdiv>\n    <h1 style=\"margin:14px 0 0; font-size:clamp(30px,5.2vw,52px); line-height:1.03; letter-spacing:-.024em; max-width:16ch; text-wrap:balance;\">What Changed.<\u002Fh1>\n    <p style=\"margin:16px 0 0; font-size:clamp(16px,2vw,19px); line-height:1.5; color:var(--color-neutral-800); max-width:54ch; text-wrap:pretty;\">Open any line for its history and the words behind it.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:clamp(28px,4vw,44px); display:flex; flex-wrap:wrap; gap:14px clamp(22px,4vw,52px);\">\n    <sc-for list=\"{{ topline }}\" as=\"t\" hint-placeholder-count=\"4\">\n      <div style=\"flex:0 0 auto;\">\n        <span style=\"font-family:var(--font-heading); font-weight:600; font-size:clamp(24px,3.6vw,34px); line-height:1; letter-spacing:-.022em; color:{{ t.tone }};\">{{ t.v }}<\u002Fspan>\n        <span style=\"margin-left:9px; font-size:13px; color:var(--color-neutral-700);\">{{ t.k }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ hasChanges }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"margin-top:clamp(38px,5.5vw,60px);\">\n      <div style=\"width:96px; height:3px; background:var(--color-accent-2);\"><\u002Fdiv>\n      <div style=\"padding-top:10px; font-family:var(--font-heading); font-weight:600; font-size:clamp(16px,2vw,19px); color:var(--color-accent-2-700);\">Flagged since the last check px; letter-spacing:.11em; text-transform:uppercase; color:var(--color-neutral-700);\">\n      <div style=\"flex:1 1 220px; min-width:min(100%,200px);\">What buyers said<\u002Fdiv>\n      <div style=\"flex:none; width:132px; display:flex; justify-content:space-between; gap:6px;\"><span>28 Mar<\u002Fspan><span>8 Aug<\u002Fspan><\u002Fdiv>\n      <div style=\"flex:none; width:52px; text-align:right;\">Now<\u002Fdiv>\n      <div style=\"flex:none; width:74px; text-align:right;\">Last heard<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-direction:column;\">\n      <sc-for list=\"{{ rows }}\" as=\"it\" hint-placeholder-count=\"8\">\n        <div style=\"border-bottom:1px solid var(--color-divider);\">\n          <div class=\"gr-row\" role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ it.toggle }}\" sc-camel-on-key-down=\"{{ it.onKey }}\" style=\"display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; padding:12px 8px; margin-left:-8px;\">\n            <div style=\"flex:1 1 220px; min-width:min(100%,200px); display:flex; gap:10px; align-items:flex-start;\">\n              <span style=\"flex:none; width:12px; font-size:13px; line-height:1.55; color:var(--color-accent-700);\">{{ it.caret }}<\u002Fspan>\n              <span style=\"flex:1; min-width:0;\">\n                <span style=\"display:block; font-size:15.5px; line-height:1.4; text-wrap:pretty;\">{{ it.claim }}<\u002Fspan>\n                <span style=\"display:block; margin-top:3px; font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--color-neutral-700);\">{{ it.meta }}<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"flex:none; width:132px; display:flex; gap:1px; align-items:stretch;\">\n              <sc-for list=\"{{ it.cells }}\" as=\"c\" hint-placeholder-count=\"9\">\n                <div style=\"flex:1; height:24px; background:{{ c.bg }}; border-top:{{ c.mark }};\" title=\"{{ c.title }}\"><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"flex:none; width:52px; text-align:right; font-family:var(--font-heading); font-weight:600; font-size:15px; color:{{ it.moveColor }};\">{{ it.now }}<\u002Fdiv>\n            <div style=\"flex:none; width:74px; text-align:right; font-size:12.5px; color:var(--color-neutral-700);\">{{ it.lastHeard }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ it.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:2px 0 26px 22px; display:flex; flex-wrap:wrap; gap:clamp(20px,3vw,44px); align-items:flex-start;\">\n              <div style=\"flex:1 1 320px; min-width:min(100%,280px);\">\n                <div style=\"font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--color-neutral-700);\">How loud, check by check<\u002Fdiv>\n                <div style=\"margin-top:10px; display:flex; gap:5px;\">\n                  <sc-for list=\"{{ it.readings }}\" as=\"rd\" hint-placeholder-count=\"9\">\n                    <div style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; align-items:center;\">\n                      <div style=\"width:100%; height:52px; display:flex; align-items:flex-end; background:var(--color-neutral-200);\">\n                        <div style=\"width:100%; height:{{ rd.h }}; background:{{ rd.bg }};\"><\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"font-size:10.5px; color:var(--color-neutral-700);\">{{ rd.value }}<\u002Fdiv>\n                      <div style=\"font-size:10.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--color-neutral-700); text-align:center; line-height:1.2;\">{{ rd.label }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <sc-if value=\"{{ it.hasQuotes }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"margin-top:20px; border-left:2px solid var(--color-accent-300); padding-left:18px; display:flex; flex-direction:column; gap:14px;\">\n                    <sc-for list=\"{{ it.quotes }}\" as=\"q\" hint-placeholder-count=\"2\">\n                      <div>\n                        <div style=\"font-size:16px; line-height:1.45; font-style:italic; text-wrap:pretty;\">{{ q.text }}<\u002Fdiv>\n                        <div style=\"margin-top:4px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--color-neutral-700);\">{{ q.prefix }}<a href=\"{{ q.url }}\" target=\"_blank\" rel=\"noreferrer\">{{ q.domain }}<\u002Fa><\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"flex:0 1 260px; min-width:min(100%,240px); display:flex; flex-direction:column; gap:14px;\">\n                <div>\n                  <div style=\"font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--color-neutral-700);\">On the record<\u002Fdiv>\n                  <div style=\"margin-top:5px; font-size:14px; line-height:1.5; color:var(--color-neutral-800);\">{{ it.recordLine }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--color-accent-700);\">What to do<\u002Fdiv>\n                  <div style=\"margin-top:5px; font-size:14px; line-height:1.5; color:var(--color-neutral-800);\">{{ it.advice }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ hasMore }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"padding-top:16px;\">\n        <button class=\"btn btn-secondary\" type=\"button\" sc-camel-on-click=\"{{ toggleMore }}\" style=\"font-size:13.5px;\">{{ moreLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"margin-top:16px; display:flex; align-items:center; gap:8px 24px; flex-wrap:wrap; font-size:12.5px; color:var(--color-neutral-700);\">\n      <span style=\"display:flex; align-items:center; gap:8px;\"><span style=\"display:inline-block; width:36px; height:12px; background:linear-gradient(to right,#dfeef4,#0088b0);\"><\u002Fspan>Quiet to loud<\u002Fspan>\n      <span style=\"display:flex; align-items:center; gap:8px;\"><span style=\"display:inline-block; width:16px; height:12px; border-top:3px solid var(--color-accent-2);\"><\u002Fspan>First time heard<\u002Fspan>\n      <span style=\"display:flex; align-items:center; gap:8px;\"><span style=\"display:inline-block; width:16px; height:12px; background:var(--color-neutral-200);\"><\u002Fspan>Not heard<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:clamp(44px,6.5vw,76px);\">\n    <div style=\"width:96px; height:3px; background:var(--color-accent-2);\"><\u002Fdiv>\n    <h2 style=\"margin:0; padding-top:12px; font-size:clamp(23px,3.4vw,31px); line-height:1.12; letter-spacing:-.016em; max-width:22ch;\">What AI tells your buyers.<\u002Fh2>\n    <p style=\"margin:12px 0 0; font-size:15.5px; line-height:1.5; color:var(--color-neutral-800); max-width:56ch; text-wrap:pretty;\">{{ answersNote }}<\u002Fp>\n\n    <div style=\"margin-top:clamp(20px,3vw,30px); display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr)); gap:clamp(20px,2.6vw,34px);\">\n      <sc-for list=\"{{ questions }}\" as=\"q\" hint-placeholder-count=\"6\">\n        <div style=\"display:flex; flex-direction:column; border-top:1px solid var(--color-text); padding-top:12px;\">\n          <div style=\"display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 10px;\">\n            <span class=\"{{ q.tagClass }}\">{{ q.verdict }}<\u002Fspan>\n            <span style=\"font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--color-neutral-700);\">{{ q.meta }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:9px; font-size:16px; line-height:1.4; font-style:italic; text-wrap:pretty;\">{{ q.text }}<\u002Fdiv>\n          <div style=\"margin-top:9px; font-size:13.5px; line-height:1.45; color:var(--color-neutral-800);\">{{ q.namedLine }}<\u002Fdiv>\n          <div style=\"margin-top:11px;\">\n            <button type=\"button\" sc-camel-on-click=\"{{ q.toggle }}\" style=\"font-family:var(--font-body); font-size:13px; padding:0; border:none; background:none; cursor:pointer; color:var(--color-accent-700); border-bottom:1px solid color-mix(in srgb, var(--color-accent-700) 30%, transparent);\" style-hover=\"color:var(--color-accent-600);\">{{ q.cta }}<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ q.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:12px; border-left:2px solid var(--color-accent-2-300); padding-left:16px;\">\n              <div style=\"font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--color-neutral-700);\">Answered {{ q.fetched }}<\u002Fdiv>\n              <div style=\"margin-top:8px; font-size:14.5px; line-height:1.55; color:var(--color-neutral-800); white-space:pre-wrap;\">{{ q.excerpt }}<\u002Fdiv>\n              <div style=\"margin-top:10px; font-size:13px; line-height:1.5; color:var(--color-neutral-800);\">{{ q.why }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"margin:clamp(38px,5vw,60px) 0 0; font-size:clamp(16px,2vw,19px); line-height:1.5; max-width:58ch; font-style:italic; text-wrap:pretty; color:var(--color-neutral-800);\">A finding loses weight every check it is not repeated, and drops off the record once it goes quiet. Nobody decides to remove it.<\u002Fp>\n\n<\u002Fmain>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1320,&quot;height&quot;:1600}}\">\nconst MOVE = {\n  intensifying: [\"Getting louder\", \"var(--color-accent-700)\"],\n  persistent:   [\"Said every time\", \"var(--color-accent-700)\"],\n  emerging:     [\"First time heard\", \"var(--color-accent-2-700)\"],\n  present:      [\"Steady\", \"var(--color-neutral-700)\"],\n  fading:       [\"Going quiet\", \"var(--color-neutral-700)\"],\n  dormant:      [\"Gone quiet\", \"var(--color-neutral-700)\"]\n};\n\nconst ROLLUP = {\n  AI_STEERS_AWAY:      [\"Sends them elsewhere\", \"tag tag-accent-2\"],\n  AI_NO_ANSWER_EXISTS: [\"No answer exists\", \"tag tag-outline\"],\n  AI_NEUTRAL:          [\"Answers, ignores you\", \"tag tag-neutral\"],\n  AI_RECOMMENDS:       [\"Recommends you\", \"tag tag-accent\"]\n};\n\nconst WHY = {\n  AI_STEERS_AWAY: \"Your buyer asks this and is handed a competitor.\",\n  AI_NO_ANSWER_EXISTS: \"Nobody has answered this in public. First good page wins it.\",\n  AI_NEUTRAL: \"The answer is fine and you are not in it.\",\n  AI_RECOMMENDS: \"You are being recommended here. Worth protecting.\"\n};\n\nconst MONTHS = [\"Jan\",\"Feb\",\"Mar\",\"Apr\",\"May\",\"Jun\",\"Jul\",\"Aug\",\"Sep\",\"Oct\",\"Nov\",\"Dec\"];\n\nfunction pretty(d) {\n  if (!d) return \"\";\n  const p = String(d).split(\"-\");\n  const mon = MONTHS[Number(p[1]) - 1];\n  if (!mon) return p[0] || \"\";\n  if (p.length < 3 || !p[2] || isNaN(Number(p[2]))) return mon + \" \" + p[0];\n  return Number(p[2]) + \" \" + mon;\n}\nfunction shortWeek(w) {\n  const p = String(w).split(\"-\");\n  return Number(p[2]) + \" \" + MONTHS[Number(p[1]) - 1];\n}\nfunction heat(v) {\n  if (v === null || v === undefined) return \"var(--color-neutral-200)\";\n  const t = Math.max(0, Math.min(1, v / 10));\n  const mix = (a, b) => Math.round(a + (b - a) * (0.12 + t * 0.88));\n  return \"rgb(\" + mix(243, 0) + \",\" + mix(242, 136) + \",\" + mix(242, 176) + \")\";\n}\n\nconst FILTERS = [\n  { key: \"all\", label: \"Everything\" },\n  { key: \"louder\", label: \"Getting louder\" },\n  { key: \"fading\", label: \"Going quiet\" },\n  { key: \"dormant\", label: \"Gone quiet\" }\n];\n\nconst PAGE = 8;\n\nclass Component extends DCLogic {\n  state = { data: null, open: {}, openQ: {}, copied: false, filter: \"all\", showAll: false };\n\n  componentDidMount() {\n    fetch((window.__resources && window.__resources.temporalData) || \"temporal-intelligence.json\")\n      .then(r => r.json())\n      .then(data => this.setState({ data }))\n      .catch(() => this.setState({ data: {} }));\n  }\n\n  share() {\n    const done = () => {\n      this.setState({ copied: true });\n      clearTimeout(this._t);\n      this._t = setTimeout(() => this.setState({ copied: false }), 2400);\n    };\n    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(location.href).then(done, done);\n    else done();\n  }\n\n  toggle(id) { this.setState(s => ({ open: { ...s.open, [id]: !s.open[id] } })); }\n  toggleQ(id) { this.setState(s => ({ openQ: { ...s.openQ, [id]: !s.openQ[id] } })); }\n  pick(key) { this.setState({ filter: key, showAll: false }); }\n\n  mapItem(it, weeks) {\n    const [label, color] = MOVE[it.movement] || [\"Tracked\", \"var(--color-neutral-700)\"];\n    const open = !!this.state.open[it.id];\n    const firstIdx = it.series.findIndex(v => v !== null);\n    const bits = [it.lens.replace(/_/g, \" \")];\n    if (it.competitor) bits.push(\"vs \" + it.competitor);\n    bits.push(it.seenAcross + \" sites\");\n    const advice = it.movement === \"dormant\"\n      ? \"Take it out of your objection handling. Buyers stopped raising it.\"\n      : it.movement === \"fading\"\n        ? \"Stop leading with it. Keep it as an answer, drop it from the headline.\"\n        : it.movement === \"emerging\"\n          ? \"Watch it. One more check tells you whether it holds.\"\n          : \"Say it in your own words before a competitor does.\";\n    return {\n      id: it.id,\n      claim: it.claim.length > 96 ? it.claim.slice(0, 94) + \"…\" : it.claim,\n      meta: bits.join(\" · \"),\n      open,\n      caret: open ? \"▾\" : \"▸\",\n      toggle: () => this.toggle(it.id),\n      onKey: e => { if (e.key === \"Enter\" || e.key === \" \") { e.preventDefault(); this.toggle(it.id); } },\n      now: it.intensity.toFixed(1),\n      moveColor: color,\n      movementLabel: label,\n      lastHeard: pretty(it.lastSeen),\n      cells: it.series.map((v, i) => ({\n        bg: heat(v),\n        mark: i === firstIdx ? \"3px solid var(--color-accent-2)\" : \"3px solid transparent\",\n        title: (weeks[i] ? shortWeek(weeks[i]) + \": \" : \"\") + (v === null ? \"not heard\" : v.toFixed(1) + \" of 10\")\n      })),\n      readings: (weeks || []).map((w, i) => {\n        const v = it.series[i];\n        return {\n          label: shortWeek(w),\n          value: v === null ? \"—\" : v.toFixed(1),\n          h: v === null ? \"0%\" : Math.max(3, Math.round((v / 10) * 100)) + \"%\",\n          bg: v === null ? \"transparent\" : heat(v)\n        };\n      }),\n      hasQuotes: it.quotes.length > 0,\n      quotes: it.quotes.map(q => ({\n        text: \"\\u201c\" + q.q + \"\\u201d\",\n        domain: q.domain,\n        url: q.url,\n        prefix: pretty(q.date) ? pretty(q.date) + \" · \" : \"\"\n      })),\n      recordLine: \"First heard \" + pretty(it.firstSeen) + \". Last heard \" + pretty(it.lastSeen) + \". Said in \" + it.weeks + \" of 9 checks, across \" + it.seenAcross + \" sites.\",\n      advice\n    };\n  }\n\n  renderVals() {\n    const d = this.state.data || {};\n    const weeks = d.weeks || [];\n    const c = d.counts || { tracked: 0, rising: 0, fading: 0, dormant: 0 };\n    const cyan = \"var(--color-accent-700)\", mag = \"var(--color-accent-2-700)\", ink = \"var(--color-text)\";\n\n    const pool = {\n      louder: d.rising || [],\n      fading: d.fading || [],\n      dormant: d.dormant || []\n    };\n    const all = [].concat(pool.louder, pool.fading, pool.dormant);\n    const picked = this.state.filter === \"all\" ? all : pool[this.state.filter] || [];\n    const mapped = picked.map(it => this.mapItem(it, weeks));\n    const shown = this.state.showAll ? mapped : mapped.slice(0, PAGE);\n    const hidden = mapped.length - shown.length;\n\n    const questions = (d.questions || []).map(q => {\n      const [verdict, tagClass] = ROLLUP[q.rollup] || [\"Tracked\", \"tag tag-neutral\"];\n      const open = !!this.state.openQ[q.id];\n      const bits = [];\n      if (q.surface) bits.push(q.surface === \"chatgpt\" ? \"ChatGPT\" : q.surface);\n      if (q.series && q.series.length) bits.push(\"checked \" + q.series.length + \"×\");\n      return {\n        text: q.text.length > 96 ? q.text.slice(0, 94) + \"…\" : q.text,\n        meta: bits.join(\" · \"),\n        verdict, tagClass,\n        namedLine: q.named && q.named.length ? \"Names \" + q.named.join(\" and \") + \" instead of you.\" : \"Nobody named.\",\n        open,\n        cta: open ? \"Hide the answer\" : \"Read the answer\",\n        toggle: () => this.toggleQ(q.id),\n        excerpt: q.excerpt ? q.excerpt.trim() + \"…\" : \"No answer was returned.\",\n        fetched: pretty(d.asOf),\n        why: WHY[q.rollup] || \"Worth watching.\"\n      };\n    });\n\n    const changes = (d.changes || []).map(ch => {\n      let domain = \"\";\n      try { domain = new URL(ch.url).hostname.replace(/^www\\./, \"\"); } catch (e) { domain = ch.url; }\n      return {\n        severity: ch.severity === \"critical\" ? \"Critical\" : ch.severity === \"high\" ? \"High\" : \"Noted\",\n        tagClass: ch.severity === \"critical\" || ch.severity === \"high\" ? \"tag tag-accent-2\" : \"tag tag-neutral\",\n        meta: pretty(ch.at) + \" · \" + (ch.scope === \"market\" ? \"your market\" : ch.scope),\n        title: ch.kind === \"security\" ? \"A reviewer raised a security risk\"\n          : ch.kind === \"pricing_change\" ? \"A new pricing argument appeared\"\n          : \"Something moved on a page we watch\",\n        detail: ch.detail.replace(/^[a-z]/, m => m.toUpperCase()),\n        url: ch.url,\n        domain\n      };\n    });\n\n    const on = d.surfaces && d.surfaces.on ? d.surfaces.on.map(x => x === \"chatgpt\" ? \"ChatGPT\" : x).join(\", \") : \"\";\n    const off = d.surfaces && d.surfaces.off ? d.surfaces.off.map(x => x[0].toUpperCase() + x.slice(1)).join(\" and \") : \"\";\n\n    return {\n      copied: this.state.copied,\n      share: () => this.share(),\n      topline: [\n        { v: c.tracked, k: \"findings tracked\", tone: ink },\n        { v: c.rising, k: \"getting louder\", tone: cyan },\n        { v: c.fading, k: \"going quiet\", tone: ink },\n        { v: c.dormant, k: \"gone quiet\", tone: mag }\n      ],\n      filters: FILTERS.map(f => ({\n        label: f.label,\n        on: this.state.filter === f.key,\n        pick: () => this.pick(f.key)\n      })),\n      rows: shown,\n      hasMore: hidden > 0 || this.state.showAll,\n      moreLabel: this.state.showAll ? \"Show fewer\" : \"Show \" + hidden + \" more\",\n      toggleMore: () => this.setState(s => ({ showAll: !s.showAll })),\n      hasChanges: changes.length > 0,\n      changes,\n      questions,\n      answersNote: on\n        ? \"We put your buyers' real questions to \" + on + \" on a schedule and keep every answer. Not yet watching \" + off + \".\"\n        : \"We put your buyers' real questions to the answer engines on a schedule and keep every answer.\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
